server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' 'unsafe-eval'; object-src 'none';" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.wasm$ {
        types {
            application/wasm wasm;
        }
        try_files $uri =404;
    }
}